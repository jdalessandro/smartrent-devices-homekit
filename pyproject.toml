[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smartrent-homekit"
version = "0.1.0"
description = "SmartRent devices exposed to Apple HomeKit (HAP-python)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "HAP-python>=4.9.0",
  "httpx>=0.27.0",
  "click>=8.1.0",
  "rich>=13.0.0",
  "textual>=0.58.0",
  "platformdirs>=4.0.0",
]

[project.scripts]
smartrent-homekit = "smartrent_homekit.__main__:main"
smartrent-homekit-setup = "smartrent_homekit.cli_setup:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
